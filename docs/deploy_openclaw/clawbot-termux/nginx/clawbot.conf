# ClawBot reverse proxy — Nginx config for cloud server
# Deploy to: /etc/nginx/conf.d/clawbot.conf on 114.55.130.197
#
# Proxies external requests to the OpenClaw Gateway running on the
# Android phone, which is reachable via an SSH reverse tunnel on
# localhost:28789.

server {
    listen 28790;
    server_name _;

    # Static photos uploaded from phone via SCP
    location /photos/ {
        alias /var/www/clawbot-photos/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # WebSocket + HTTP reverse proxy
    location / {
        proxy_pass http://127.0.0.1:28789;
        proxy_http_version 1.1;

        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts suitable for long-running AI responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
